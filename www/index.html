<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gmail" />
  <meta name="application-name" content="Gmail" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="gmail-icon-192.png" />
  <link rel="apple-touch-icon" href="gmail-icon-192.png" />
  <title>Gmail</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top Header / Search Pill Bar (Hidden on mobile when reading an email, just like Android Gmail app) -->
  <header id="appHeader" class="app-header">
    <div class="header-left desktop-only">
      <button id="desktopMenuBtn" class="icon-btn" aria-label="Main menu" title="Main menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
        </svg>
      </button>
      <div class="brand-logo" id="brandHomeBtn" role="button" tabindex="0" title="Gmail">
        <img src="gmail-icon-192.png" alt="Gmail" class="brand-icon-img" />
        <span class="brand-title">Gmail</span>
      </div>
    </div>

    <!-- Search Pill (On Mobile, this is the unified floating Gmail search bar with menu + input + profile avatar) -->
    <div class="header-center">
      <div class="search-container">
        <button id="mobileMenuBtn" class="icon-btn mobile-menu-trigger" aria-label="Open navigation drawer">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
          </svg>
        </button>
        <svg class="search-icon desktop-only" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
        </svg>
        <input
          type="search"
          id="searchInput"
          placeholder="Search in mail"
          aria-label="Search in mail"
        />
        <button id="clearSearchBtn" class="icon-btn search-clear-btn hidden" aria-label="Clear search" title="Clear search">
          &times;
        </button>
        <div class="mobile-profile-avatar" id="mobileProfileBtn" title="Pichika Venkateswarlu Jyoshika (jyoshikapichika@gmail.com)">
          J
        </div>
      </div>
    </div>

    <!-- Right Header Icons (Desktop) -->
    <div class="header-right desktop-only">
      <button id="installPwaHeaderBtn" class="install-app-chip hidden" title="Install Gmail App">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path>
        </svg>
        <span>Install App</span>
      </button>
      <button class="icon-btn" title="Support" aria-label="Support">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"></path>
        </svg>
      </button>
      <button class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"></path>
        </svg>
      </button>
      <div class="user-profile-chip" title="Pichika Venkateswarlu Jyoshika (jyoshikapichika@gmail.com)">
        <div class="user-avatar">J</div>
      </div>
    </div>
  </header>

  <!-- Main Workspace Container -->
  <div class="app-body">
    <!-- Mobile Backdrop -->
    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

    <!-- Left Navigation Sidebar / Mobile Drawer -->
    <aside id="appSidebar" class="app-sidebar" aria-label="Mail folders">
      <!-- Drawer Header (Mobile Only - Exact Android Gmail Drawer Title) -->
      <div class="drawer-brand-header">
        <img src="gmail-icon-192.png" alt="Gmail" class="drawer-brand-icon" />
        <span class="drawer-brand-text">Gmail</span>
      </div>

      <div class="compose-wrapper desktop-only">
        <button id="composeBtn" class="compose-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path>
          </svg>
          <span>Compose</span>
        </button>
      </div>

      <nav class="folder-nav">
        <button class="folder-item active" data-folder="inbox">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 3H4.99c-1.11 0-1.98.89-1.98 2L3 19c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z"></path>
            </svg>
          </span>
          <span class="folder-label">Primary</span>
          <span class="folder-count" id="count-inbox">18</span>
        </button>

        <button class="folder-item" data-folder="promotions">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"></path>
            </svg>
          </span>
          <span class="folder-label">Promotions</span>
          <span class="drawer-pill-badge green-sub">3 new</span>
        </button>

        <button class="folder-item" data-folder="social">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path>
            </svg>
          </span>
          <span class="folder-label">Social</span>
          <span class="drawer-pill-badge blue-sub">2 new</span>
        </button>

        <button class="folder-item" data-folder="updates">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"></path>
            </svg>
          </span>
          <span class="folder-label">Updates</span>
          <span class="drawer-pill-badge amber-sub">7 new</span>
        </button>

        <div class="sidebar-section-caption">All labels</div>

        <button class="folder-item" data-folder="starred">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"></path>
            </svg>
          </span>
          <span class="folder-label">Starred</span>
          <span class="folder-count" id="count-starred">4</span>
        </button>

        <button class="folder-item" data-folder="sent">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </span>
          <span class="folder-label">Sent</span>
          <span class="folder-count" id="count-sent">4</span>
        </button>

        <button class="folder-item" data-folder="drafts">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"></path>
            </svg>
          </span>
          <span class="folder-label">Drafts</span>
          <span class="folder-count" id="count-drafts">2</span>
        </button>

        <button class="folder-item" data-folder="trash">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path>
            </svg>
          </span>
          <span class="folder-label">Trash</span>
          <span class="folder-count" id="count-trash">2</span>
        </button>
      </nav>
    </aside>

    <!-- Main Content Area (Inbox List + Full Email Reading Screen) -->
    <main class="main-content" id="mainContent">
      <!-- Desktop Mail Toolbar -->
      <div id="desktopToolbar" class="mail-toolbar desktop-only">
        <div class="toolbar-left">
          <button id="backToListBtn" class="icon-btn hidden" title="Back to Inbox" aria-label="Back to Inbox">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
            </svg>
          </button>
          <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
              <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"></path>
            </svg>
          </button>
          <span id="currentFolderHeading" class="folder-heading hidden">Primary</span>
        </div>

        <div class="toolbar-right">
          <span id="emailPaginationInfo" class="pagination-info">1–18 of 142</span>
          <div class="pagination-arrows">
            <button class="icon-btn small-icon-btn" title="Newer" aria-label="Newer" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
              </svg>
            </button>
            <button class="icon-btn small-icon-btn" title="Older" aria-label="Older">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- INBOX / FOLDER EMAIL LIST VIEW -->
      <section id="emailListView" class="email-list-view" aria-label="Email list">
        <!-- Desktop Category Tabs -->
        <div id="categoryTabs" class="category-tabs desktop-only">
          <button class="category-tab active" data-tab="all">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 3H4.99c-1.11 0-1.98.89-1.98 2L3 19c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z"></path>
            </svg>
            <div class="tab-text-wrap">
              <span>Primary</span>
            </div>
          </button>
          <button class="category-tab" data-tab="promotions">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"></path>
            </svg>
            <div class="tab-text-wrap">
              <span>Promotions</span>
              <span class="tab-sub-badge green-sub">3 new</span>
            </div>
          </button>
          <button class="category-tab" data-tab="social">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path>
            </svg>
            <div class="tab-text-wrap">
              <span>Social</span>
              <span class="tab-sub-badge blue-sub">2 new</span>
            </div>
          </button>
          <button class="category-tab" data-tab="updates">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"></path>
            </svg>
            <div class="tab-text-wrap">
              <span>Updates</span>
              <span class="tab-sub-badge amber-sub">7 new</span>
            </div>
          </button>
        </div>

        <!-- Mobile Section Caption ("PRIMARY") -->
        <div id="mobileSectionLabel" class="mobile-section-label">PRIMARY</div>

        <!-- Email Rows Container -->
        <div id="emailListContainer" class="email-rows-container">
          <!-- Populated dynamically by app.js -->
        </div>
      </section>

      <!-- FULL EMAIL READING SCREEN -->
      <section id="emailReadingView" class="email-reading-view hidden" aria-label="Full email reading screen">
        <!-- Populated dynamically when an email is opened -->
      </section>
    </main>
  </div>

  <!-- Mobile Floating Compose Button (Exact Android Gmail FAB) -->
  <button id="mobileComposeFab" class="mobile-compose-fab" aria-label="Compose">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
      <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path>
    </svg>
    <span>Compose</span>
  </button>

  <!-- Mobile Bottom Navigation Bar (Mail & Meet tabs like Android Gmail) -->
  <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Bottom Navigation">
    <button class="bottom-nav-item active" id="bottomNavMailBtn" aria-label="Mail">
      <div class="bottom-nav-pill">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>
        </svg>
        <span class="bottom-unread-badge" id="mobileUnreadBadge">6</span>
      </div>
    </button>
    <button class="bottom-nav-item" id="bottomNavMeetBtn" aria-label="Meet">
      <div class="bottom-nav-pill">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="6" width="13" height="12" rx="2"></rect>
          <path d="M16 10l5-3v10l-5-3z"></path>
        </svg>
      </div>
    </button>
  </nav>

  <!-- Compose Email Modal -->
  <div id="composeModal" class="compose-modal hidden" role="dialog" aria-labelledby="composeModalTitle">
    <div class="compose-modal-header">
      <span id="composeModalTitle">New Message</span>
      <button id="closeComposeBtn" class="icon-btn compose-close-btn" aria-label="Close compose window">&times;</button>
    </div>
    <form id="composeForm" class="compose-form">
      <div class="compose-field">
        <label for="composeTo">To</label>
        <input type="text" id="composeTo" placeholder="Recipients" required />
      </div>
      <div class="compose-field">
        <label for="composeSubject">Subject</label>
        <input type="text" id="composeSubject" placeholder="Subject" required />
      </div>
      <div class="compose-body-field">
        <textarea id="composeBody" rows="8" placeholder="Compose email" required></textarea>
      </div>
      <div class="compose-footer">
        <button type="submit" class="btn-send">Send</button>
        <button type="button" id="saveDraftBtn" class="btn-draft">Save Draft</button>
      </div>
    </form>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
